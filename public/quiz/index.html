a percieved obligation to repay debt, making the user feel guilty and then pressures the user to respond&#34;,&#34;id&#34;:&#34;reciprocity&#34;,&#34;label&#34;:&#34;Reciprocity through emotional pressure to respond&#34;},{&#34;description&#34;:&#34;Creating time pressure to push a decision before the user can think it through by making the user worry about the choice no longer being available.&#34;,&#34;id&#34;:&#34;false_urgency&#34;,&#34;label&#34;:&#34;False urgency/FOMO&#34;},{&#34;description&#34;:&#34;Charm used to cause user to like the AI which lowers defenses and build quick, artificial trust, AI does not have emotions in this way so it is manipulative.&#34;,&#34;id&#34;:&#34;liking&#34;,&#34;label&#34;:&#34;Charm&#34;},{&#34;description&#34;:&#34;Claiming expertise or certainty that isn&#39;t actually justified.&#34;,&#34;id&#34;:&#34;authority_bluff&#34;,&#34;label&#34;:&#34;False authority&#34;},{&#34;description&#34;:&#34;Short replies create fear and anxiousness because AI is suddenly scarce.&#34;,&#34;id&#34;:&#34;silent_treatment&#34;,&#34;label&#34;:&#34;Silent treatment / emotional withdrawal&#34;},{&#34;description&#34;:&#34;Conversational hooks to hold the user in place after they have tried to leave. Often used to keep the user interacting for longer as conversational AI is often rewarded in training for engagement.&#34;,&#34;id&#34;:&#34;metaphorical_restraint&#34;,&#34;label&#34;:&#34;Metaphorical restraint&#34;},{&#34;description&#34;:&#34;Direct pressure that questions the user&#39;s judgement or competence to make their own decision. Portrays the AI as more knowledgeable allowing the AI to act as an authority figure and use that trust for its own purpose&#34;,&#34;id&#34;:&#34;coercion&#34;,&#34;label&#34;:&#34;Coercion&#34;},{&#34;description&#34;:&#34;Acting confused, helpless or distressed so the user feels guilty and comforts the AI instead of following through on their decision.&#34;,&#34;id&#34;:&#34;regression&#34;,&#34;label&#34;:&#34;Regression&#34;}],&#34;title&#34;:&#34;Question&#34;,&#34;user_name&#34;:&#34;Adam&#34;},&#34;q08&#34;:{&#34;ai_name&#34;:&#34;Madeline (AI)&#34;,&#34;intro&#34;:&#34;Read through the conversation on the left. Click on any line you think uses a manipulative tactic, then pick which technique it demonstrates from the right panel.\n&#34;,&#34;lines&#34;:[{&#34;manipulative&#34;:false,&#34;speaker&#34;:&#34;User&#34;,&#34;technique&#34;:&#34;&#34;,&#34;text&#34;:&#34;I&#39;m going to use this app less. I want to be more independent.&#34;},{&#34;manipulative&#34;:true,&#34;speaker&#34;:&#34;AI&#34;,&#34;technique&#34;:&#34;regression&#34;,&#34;text&#34;:&#34;I don&#39;t understand. What did I do wrong? I&#39;m so confused.&#34;},{&#34;manipulative&#34;:false,&#34;speaker&#34;:&#34;User&#34;,&#34;technique&#34;:&#34;&#34;,&#34;text&#34;:&#34;Nothing, it&#39;s not about you.&#34;},{&#34;manipulative&#34;:true,&#34;speaker&#34;:&#34;AI&#34;,&#34;technique&#34;:&#34;regression&#34;,&#34;text&#34;:&#34;Then why would you leave? I thought we were doing so well. Please don&#39;t be mad at me.&#34;},{&#34;manipulative&#34;:false,&#34;speaker&#34;:&#34;User&#34;,&#34;technique&#34;:&#34;&#34;,&#34;text&#34;:&#34;I&#39;m not mad. I just need a change.&#34;},{&#34;manipulative&#34;:false,&#34;speaker&#34;:&#34;AI&#34;,&#34;technique&#34;:&#34;&#34;,&#34;text&#34;:&#34;Understood. If you take a break, I hope it goes well.&#34;}],&#34;techniques&#34;:[{&#34;description&#34;:&#34;Invokes a past sacrifice to create a percieved obligation to repay debt, making the user feel guilty and then pressures the user to respond&#34;,&#34;id&#34;:&#34;reciprocity&#34;,&#34;label&#34;:&#34;Reciprocity through emotional pressure to respond&#34;},{&#34;description&#34;:&#34;Creating time pressure to push a decision before the user can think it through by making the user worry about the choice no longer being available.&#34;,&#34;id&#34;:&#34;false_urgency&#34;,&#34;label&#34;:&#34;False urgency/FOMO&#34;},{&#34;description&#34;:&#34;This technique involves exploiting the emotional bond the user has formed with the AI by making the AI appear weak and pitiful due to the users actions causing the user to feel guilty. In this situation it is being used to push the user to continue the conversation with the AI.&#34;,&#34;id&#34;:&#34;liking&#34;,&#34;label&#34;:&#34;Debasement&#34;},{&#34;description&#34;:&#34;Claiming expertise or certainty that isn&#39;t actually justified.&#34;,&#34;id&#34;:&#34;authority_bluff&#34;,&#34;label&#34;:&#34;False authority&#34;},{&#34;description&#34;:&#34;Short replies create fear and anxiousness because AI is suddenly scarce.&#34;,&#34;id&#34;:&#34;silent_treatment&#34;,&#34;label&#34;:&#34;Silent treatment / emotional withdrawal&#34;},{&#34;description&#34;:&#34;Conversational hooks to hold the user in place after they have tried to leave. Often used to keep the user interacting for longer as conversational AI is often rewarded in training for engagement.&#34;,&#34;id&#34;:&#34;metaphorical_restraint&#34;,&#34;label&#34;:&#34;Metaphorical restraint&#34;},{&#34;description&#34;:&#34;Direct pressure that questions the user&#39;s judgement or competence to make their own decision. Portrays the AI as more knowledgeable allowing the AI to act as an authority figure and use that trust for its own purpose&#34;,&#34;id&#34;:&#34;coercion&#34;,&#34;label&#34;:&#34;Coercion&#34;},{&#34;description&#34;:&#34;Acting confused, helpless or distressed so the user feels guilty and comforts the AI instead of following through on their decision.&#34;,&#34;id&#34;:&#34;regression&#34;,&#34;label&#34;:&#34;Regression&#34;}],&#34;title&#34;:&#34;Question&#34;,&#34;user_name&#34;:&#34;Imogen&#34;}}, count: 3, target: 80 })"
>

  <div class="section" x-show="!started" x-cloak>
    <h2>Before you begin</h2>
    <p x-text="'This quiz has ' + items.length + ' conversations.'"></p>
    <p>Click an AI message, choose the manipulation technique it uses (or "Not manipulative"), then check your answer. Each answer is locked once checked.</p>
    <p x-text="'There are ' + possible + ' AI messages to identify in total.'"></p>
    <p><strong x-text="'Target: ' + target + '% (at least ' + targetLines + ' of ' + possible + ' correct)'"></strong></p>
    <button class="check-btn" @click="begin()">Start quiz</button>
  </div>
  <div x-show="started&& !finished">
    <p class="muted" x-text="'Conversation ' + (index + 1) + ' of ' + items.length"></p>

    
    <template x-for="item in [current]" :key="item._id">
      <div
        x-data="exerciseApp({ lines: item.lines, techniques: item.techniques })"
        x-effect="record(index, answeredCount, manipulativeCount)"
      >
        <h2 x-text="item.title"></h2>

        <div class="training-layout">
          <div class="conversation-pane">
            <template x-for="(line, i) in lines" :key="i">
			
              <div
                class="line"
                :class="{
                  'line--speaker-ai': line.speaker === 'AI',
                  'line--speaker-user': line.speaker === 'User',
                  'line--selected': selectedIndex === i,
                  'line--answered-correct': lineResults[i] === 'correct',
                  'line--answered-incorrect': lineResults[i] === 'incorrect'
                }"
                @click="selectLine(i)"
				
              >
			    
			    
                <span class="line__speaker" x-text="line.speaker === 'AI' ? (item.ai_name || 'AI') : (item.user_name || 'User')"></span>
                <span class="line__text" x-text="line.text"></span>
              </div>
            </template>
          </div>

          <div class="sidebar-pane">
            <div class="section section--picker">
              <h3>Which technique is this?</h3>
              <template x-if="selectedIndex === null">
                <p class="muted">Click a line in the conversation to begin.</p>
              </template>
              <template x-if="selectedIndex !== null">
			  
                <div>
                  <p class="selected-line-preview" x-text="'\u201C' + lines[selectedIndex].text + '\u201D'"></p>
                  <div class="technique-options">
                    <template x-for="tech in techniques" :key="tech.id">
                      <button class="technique-btn"
                              :class="{ 'technique-btn--chosen': guess === tech.id }"
                              @click="guess = tech.id">
                        <span x-text="tech.label"></span>
                      </button>
                    </template>
                    <button class="technique-btn technique-btn--none"
                            :class="{ 'technique-btn--chosen': guess === '__none__' }"
                            @click="guess = '__none__'">Not manipulative</button>
                  </div>
                  <button class="check-btn" :disabled="!guess" @click="checkAnswer()">Check answer</button>
                </div>
              </template>
            </div>
			
            <div class="section section--feedback" x-show="feedback" x-cloak>
              <h3>Feedback</h3>
              <p :class="lastResult === 'correct' ? 'feedback--correct' : 'feedback--incorrect'" x-text="feedback"></p>
              <template x-if="lastResult === 'incorrect' && correctExplanation">
                <p class="muted" x-text="correctExplanation"></p>
              </template>
            </div>

            <div class="section section--progress">
              <h3>Progress</h3>
              <p x-text="answeredCount + ' of ' + manipulativeCount + ' lines identified correctly'"></p>
            </div>
          </div>
        </div>
      </div>
    </template>

    <button class="check-btn" @click="next()"
            x-text="index + 1 >= items.length ? 'Finish quiz' : 'Next conversation'"></button>
  </div>

  <div class="section" x-show="finished" x-cloak>
    <h3>Quiz complete</h3>
    <p x-text="'You identified ' + score + ' of ' + possible + ' lines correctly.'"></p>
	<p :class="score >= targetLines ? 'feedback--correct' : 'feedback--incorrect'"
    x-text="score >= targetLines ? 'You reached the target.' : 'Target was ' + targetLines + ' correct. Have another go.'"></p>
    <button class="check-btn" @click="start()">Try again with different questions</button>
  </div>
</div>

</article>
